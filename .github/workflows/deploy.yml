name: 🚀 Deploy Jonathanbet via Docker to VPS
on:
  push:
    branches: ["main"]
env:
  APP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/jonathanbet-app
  IMAGE_TAG: latest
  REMOTE_DIR: /opt/jonathanbet
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🧩 Checkout repo
        uses: actions/checkout@v4

      - name: 🔐 Docker login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build & Push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: 🚀 Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "→ Create dir"
            mkdir -p ${{ env.REMOTE_DIR }}
            cd ${{ env.REMOTE_DIR }}

            echo "→ Save .env"
            cat > .env << 'EOF'
            ${{ secrets.APP_ENV_FILE }}
            EOF

            echo "→ Save Caddyfile"
            cat > Caddyfile << 'EOF'
            ${{ secrets.CADDYFILE }}
            EOF

            echo "→ Save docker-compose.prod.yml"
            cat > docker-compose.prod.yml << 'EOF'
            ${{ secrets.DOCKER_COMPOSE }}
            EOF

            echo "→ Pull image"
            docker pull ${{ env.APP_IMAGE }}:${{ env.IMAGE_TAG }}

            echo "→ Restart containers"
            docker compose -f docker-compose.prod.yml down || true
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            echo "→ Run migrations"
            # даём БД чуть времени, хотя есть healthcheck
            sleep 5
            docker compose exec app_jbet php artisan migrate --force

            echo "→ DONE!"
